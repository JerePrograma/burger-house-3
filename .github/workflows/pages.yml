name: Validate Burger House VPS source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: burger-house-vps-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run parity:check
      - run: npm run typecheck
      - run: npm test
      - name: Preserve this commerce's published catalog
        run: npm run catalog:sync
      - run: npm run build
      - run: npm run build:management
      - run: npm run build:native
      - uses: actions/upload-artifact@v4
        with:
          name: burger-house-3-vps-web
          path: |
            dist-pages
            dist-management
          if-no-files-found: error
          retention-days: 14
      - name: Report deployment procedure
        run: echo 'Source verified. Production remains on the VPS; publish the committed revision with npm run deploy:vps from the authorized Windows workstation.' >> "$GITHUB_STEP_SUMMARY"
